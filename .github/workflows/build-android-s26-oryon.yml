name: Build Android S26+ Oryon APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-android-s26-oryon.yml
      - get_repo.py
      - version.py
      - setup.py
      - build.py
      - patch_scripts/series/**
      - src/chrome/browser/private_sync/**
      - arm/android/s26_oryon_args.gn
      - other/android-recover-stalled-gpu-channel.patch
      - other/android-private-sync.patch
      - other/android-socks5-h3.patch
      - other/android-thorium-branding.patch
      - other/thorium-build-config-and-simd.patch
      - other/thorium-internal-url-scheme-alias.patch

permissions:
  contents: read

concurrency:
  group: android-s26-oryon-${{ github.ref }}
  # Preserve expensive local objects and links; a newer push waits its turn.
  cancel-in-progress: false

jobs:
  build:
    name: Thorium ARM64 for Samsung Galaxy S26+
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1440
    env:
      THOR_DIR: ${{ github.workspace }}
      BUILD_LOG: ${{ github.workspace }}/build-android-s26.log
      DEPOT_TOOLS_DIR: ${{ github.workspace }}/../thorium-android-ci/depot_tools
      CR_DIR: ${{ github.workspace }}/../thorium-android-ci/chromium/src
      DEPOT_TOOLS_UPDATE: "0"
      SYNC_JOBS: "4"
      # Use the runner's 16-core CPU affinity for the local 14900K build.
      BUILD_JOBS: "16"
      # LLD otherwise interprets "all" as all 24 host threads, bypassing -j16.
      THINLTO_JOBS: "4"
      BUILD_ATTEMPTS: "10"
      NETWORK_ATTEMPTS: "5"
      NETWORK_RETRY_SECONDS: "20"
      GIT_HTTP_LOW_SPEED_LIMIT: "1"
      GIT_HTTP_LOW_SPEED_TIME: "60"
    steps:
      - name: Check out Thorium
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Validate workflow input and builder capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "Chromium synchronization is fixed at ${SYNC_JOBS} jobs."
          echo "Compile parallelism is fixed at ${BUILD_JOBS} jobs."
          echo "ThinLTO link parallelism is fixed at ${THINLTO_JOBS} jobs."
          python3 --version
          git --version
          taskset -pc "$$"
          df -h "${GITHUB_WORKSPACE}"
          available_kib=$(df --output=avail "${GITHUB_WORKSPACE}" | tail -n 1)
          if (( available_kib < 157286400 )); then
            echo "At least 150 GiB of free disk space is required." >&2
            exit 2
          fi

      - name: Bootstrap and synchronize Chromium
        shell: bash
        run: |
          set -euo pipefail
          retry_network_step() {
            local attempt=1
            local exit_code
            local delay
            until "$@"; do
              exit_code=$?
              if (( attempt >= NETWORK_ATTEMPTS )); then
                echo "Command failed after ${attempt} attempts (exit ${exit_code}): $*" >&2
                return "${exit_code}"
              fi
              delay=$((NETWORK_RETRY_SECONDS * attempt))
              echo "Network-sensitive command failed (exit ${exit_code}); retrying in ${delay}s (${attempt}/${NETWORK_ATTEMPTS}): $*" >&2
              sleep "${delay}"
              ((attempt += 1))
            done
          }

          mkdir -p "$(dirname "${DEPOT_TOOLS_DIR}")" "$(dirname "${CR_DIR}")"
          bootstrap_args=(
            --chromium-src "${CR_DIR}"
            --thorium-root "${THOR_DIR}"
            --depot-tools "${DEPOT_TOOLS_DIR}"
            --no-history
            --jobs "${SYNC_JOBS}"
            --no-chromeos-fonts
            --yes
          )
          if [[ -d "${CR_DIR}/.git" ]]; then
            bootstrap_args+=(--reuse-existing)
          fi
          retry_network_step \
            python3 get_repo.py "${bootstrap_args[@]}" 2>&1 |
            tee -a "${BUILD_LOG}"

          setup_fingerprint="$(
            git ls-files -s -- \
              setup.py \
              version.py \
              patch_scripts \
              src \
              thorium_shell \
              pak_src \
              infra/thor_ver \
              other |
              sha256sum |
              awk '{print $1}'
          )"
          overlay_fingerprint="$(
            git ls-files -s -- \
              setup.py \
              version.py \
              patch_scripts \
              src \
              thorium_shell \
              pak_src \
              infra/thor_ver \
              other \
              ':(exclude)patch_scripts/series/series' \
              ':(exclude,glob)other/*.patch' |
              sha256sum |
              awk '{print $1}'
          )"
          setup_stamp="${CR_DIR}/out/thorium/.thorium-android-setup.sha256"
          overlay_stamp="${CR_DIR}/out/thorium/.thorium-android-overlays.sha256"
          patch_fingerprint="$(
            git ls-files -s -- \
              patch_scripts/series/series \
              patch_scripts/series/apply_series.py \
              'other/*.patch' |
              sha256sum |
              awk '{print $1}'
          )"
          patch_stamp="${CR_DIR}/out/thorium/.thorium-android-patches.sha256"
          patch_state="${CR_DIR}/out/thorium/.thorium-android-patch-state.json"
          patch_start_file="${CR_DIR}/out/thorium/.thorium-android-patch-start"
          thorium_version="$(python3 -c 'import version; print(version.THORIUM_VERSION)')"
          reuse_setup=0
          incremental_setup=0
          skip_patches=0
          append_patches=0
          patch_start_index=0
          if [[ -f "${setup_stamp}" ]] &&
             [[ -f "${CR_DIR}/out/thorium/build.ninja" ]] &&
             git -C "${CR_DIR}" rev-parse --verify \
               "refs/tags/${thorium_version}^{commit}" >/dev/null 2>&1 &&
             [[ "$(git -C "${CR_DIR}" rev-parse HEAD)" == "$(git -C "${CR_DIR}" rev-parse "refs/tags/${thorium_version}^{commit}")" ]]; then
            if grep --quiet --fixed-strings --line-regexp \
                 "${setup_fingerprint}" "${setup_stamp}"; then
              reuse_setup=1
            elif [[ -f "${patch_stamp}" ]] &&
                 grep --quiet --fixed-strings --line-regexp \
                   "${patch_fingerprint}" "${patch_stamp}"; then
              incremental_setup=1
              skip_patches=1
            elif python3 patch_scripts/series/incremental_state.py \
                   check-appended \
                   --thorium-root "${THOR_DIR}" \
                   --series "${THOR_DIR}/patch_scripts/series/series" \
                   --state-file "${patch_state}" \
                   --start-index-file "${patch_start_file}"; then
              incremental_setup=1
              append_patches=1
              patch_start_index="$(cat "${patch_start_file}")"
            fi
          fi
          {
            echo "THORIUM_SETUP_FINGERPRINT=${setup_fingerprint}"
            echo "THORIUM_OVERLAY_FINGERPRINT=${overlay_fingerprint}"
            echo "THORIUM_PATCH_FINGERPRINT=${patch_fingerprint}"
            echo "THORIUM_REUSE_SETUP=${reuse_setup}"
            echo "THORIUM_INCREMENTAL_SETUP=${incremental_setup}"
            echo "THORIUM_SKIP_PATCHES=${skip_patches}"
            echo "THORIUM_APPEND_PATCHES=${append_patches}"
            echo "THORIUM_PATCH_START_INDEX=${patch_start_index}"
          } >> "${GITHUB_ENV}"

          gclient_file="$(dirname "${CR_DIR}")/.gclient"
          if ! grep --quiet --fixed-strings 'target_os = ["android"]' "${gclient_file}"; then
            printf '\n# Thorium Android CI target dependencies.\ntarget_os = ["android"]\n' \
              >> "${gclient_file}"
          fi

          if (( reuse_setup )); then
            echo "Reusing prepared Chromium source and Ninja output for ${setup_fingerprint}."
          elif (( incremental_setup )); then
            echo "Chromium ${thorium_version} and out/thorium are reusable."
            if (( append_patches )); then
              echo "The patch series was only extended; applying its new tail."
              echo "version.py reset is skipped to preserve existing Ninja objects."
            else
              echo "The patch set is unchanged; applying only changed Thorium overlays."
              echo "version.py reset and patch reapplication are both skipped."
            fi
          else
            rm -f -- "${patch_stamp}"
            retry_network_step \
              python3 version.py \
                --chromium-src "${CR_DIR}" \
                --depot-tools "${DEPOT_TOOLS_DIR}" \
                --jobs "${SYNC_JOBS}" 2>&1 |
              tee -a "${BUILD_LOG}"
          fi

      - name: Apply Thorium Android profile
        shell: bash
        run: |
          set -euo pipefail
          record_setup_state() {
            local setup_stamp="${CR_DIR}/out/thorium/.thorium-android-setup.sha256"
            local overlay_stamp="${CR_DIR}/out/thorium/.thorium-android-overlays.sha256"
            local patch_stamp="${CR_DIR}/out/thorium/.thorium-android-patches.sha256"
            local patch_state="${CR_DIR}/out/thorium/.thorium-android-patch-state.json"
            local temporary_stamp

            temporary_stamp="${setup_stamp}.tmp.${GITHUB_RUN_ID}"
            printf '%s\n' "${THORIUM_SETUP_FINGERPRINT}" > "${temporary_stamp}"
            mv -f -- "${temporary_stamp}" "${setup_stamp}"

            temporary_stamp="${overlay_stamp}.tmp.${GITHUB_RUN_ID}"
            printf '%s\n' "${THORIUM_OVERLAY_FINGERPRINT}" > "${temporary_stamp}"
            mv -f -- "${temporary_stamp}" "${overlay_stamp}"

            temporary_stamp="${patch_stamp}.tmp.${GITHUB_RUN_ID}"
            printf '%s\n' "${THORIUM_PATCH_FINGERPRINT}" > "${temporary_stamp}"
            mv -f -- "${temporary_stamp}" "${patch_stamp}"

            python3 patch_scripts/series/incremental_state.py \
              write \
              --thorium-root "${THOR_DIR}" \
              --series "${THOR_DIR}/patch_scripts/series/series" \
              --state-file "${patch_state}"
          }
          if [[ "${THORIUM_REUSE_SETUP}" == "1" ]]; then
            echo "Thorium Android source profile is unchanged; preserving prepared sources."
            record_setup_state
            exit 0
          fi
          export PATH="${DEPOT_TOOLS_DIR}:${PATH}"
          setup_args=(
            --android
            --chromium-src "${CR_DIR}"
            --thorium-root "${THOR_DIR}"
          )
          if [[ "${THORIUM_SKIP_PATCHES}" == "1" ]]; then
            setup_args+=(--skip-patches)
          elif [[ "${THORIUM_APPEND_PATCHES}" == "1" ]]; then
            setup_args+=(--patch-start-index "${THORIUM_PATCH_START_INDEX}")
          fi
          python3 setup.py "${setup_args[@]}" 2>&1 | tee -a "${BUILD_LOG}"
          record_setup_state

      - name: Verify Oryon compiler support
        shell: bash
        run: |
          set -euo pipefail
          clang="${CR_DIR}/third_party/llvm-build/Release+Asserts/bin/clang"
          rustc="${CR_DIR}/third_party/rust-toolchain/bin/rustc"
          test -x "${clang}"
          test -x "${rustc}"
          "${clang}" --target=aarch64-linux-android -mcpu=help 2>&1 |
            tee "${RUNNER_TEMP}/clang-arm64-cpus.txt" |
            grep --fixed-strings "oryon-1"
          "${rustc}" --print target-cpus --target aarch64-linux-android |
            tee "${RUNNER_TEMP}/rust-arm64-cpus.txt" |
            grep --fixed-strings "oryon-1"

      - name: Generate S26+ ARM64 build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${DEPOT_TOOLS_DIR}:${PATH}"
          gn_bin="${CR_DIR}/buildtools/linux64/gn"
          test -x "${gn_bin}"
          out_dir="${CR_DIR}/out/thorium"
          mkdir -p "${out_dir}"

          # Cap ThinLTO in the GN source that generates libchrome.ninja.
          # Editing the generated Ninja file is not durable: autoninja checks
          # the GN inputs before each build and regenerates it back to "all".
          compiler_config="${CR_DIR}/build/config/compiler/BUILD.gn"
          test -f "${compiler_config}"
          if grep --quiet --fixed-strings -- \
               '-Wl,--thinlto-jobs=all' "${compiler_config}"; then
            sed -i \
              "s/-Wl,--thinlto-jobs=all/-Wl,--thinlto-jobs=${THINLTO_JOBS}/g" \
              "${compiler_config}"
          fi
          grep --quiet --fixed-strings -- \
            "-Wl,--thinlto-jobs=${THINLTO_JOBS}" "${compiler_config}"
          if grep --quiet --fixed-strings -- \
               '-Wl,--thinlto-jobs=all' "${compiler_config}"; then
            echo "Chromium compiler config still enables all ThinLTO workers." >&2
            exit 3
          fi
          # Always refresh the graph after checking the source-level cap. This
          # is inexpensive and preserves the existing object cache.
          if ! cmp --silent arm/android/s26_oryon_args.gn "${out_dir}/args.gn"; then
            cp arm/android/s26_oryon_args.gn "${out_dir}/args.gn"
          fi

          # Siso has repeatedly panicked or hung on this WSL runner. Migrate
          # this existing output directory to Chromium's supported Ninja path.
          rm -f -- "${out_dir}/.siso_deps"

          "${gn_bin}" gen "${out_dir}" \
            --root="${CR_DIR}" 2>&1 | tee -a "${BUILD_LOG}"

          # Verify the generated link rule, not only the GN source.
          libchrome_ninja="${out_dir}/obj/chrome/android/libchrome.ninja"
          test -f "${libchrome_ninja}"
          grep --quiet --fixed-strings -- \
            "--thinlto-jobs=${THINLTO_JOBS}" "${libchrome_ninja}"
          if grep --quiet --fixed-strings -- \
               '--thinlto-jobs=all' "${libchrome_ninja}"; then
            echo "Generated libchrome rule still enables all ThinLTO workers." >&2
            exit 3
          fi
          echo "libchrome ThinLTO parallelism is capped at ${THINLTO_JOBS} jobs."

          "${gn_bin}" args "${out_dir}" \
            --root="${CR_DIR}" \
            --list=thorium_arm_cpu \
            --short 2>&1 | tee -a "${BUILD_LOG}" |
            grep --fixed-strings 'thorium_arm_cpu = "oryon-1"'
          "${gn_bin}" args "${out_dir}" \
            --root="${CR_DIR}" \
            --list=use_siso \
            --short 2>&1 | tee -a "${BUILD_LOG}" |
            grep --fixed-strings 'use_siso = false'

          build_with_retry() {
            local attempt=1
            local exit_code
            local delay
            until python3 build.py \
              --chromium-src "${CR_DIR}" \
              --thorium-root "${THOR_DIR}" \
              --out-dir out/thorium \
              --target chrome_public_apk \
              --expect-os android \
              --expect-cpu arm64 \
              --jobs "${BUILD_JOBS}" \
              --keep-going; do
              exit_code=$?
              if (( attempt >= BUILD_ATTEMPTS )); then
                echo "Build failed after ${attempt} attempts (exit ${exit_code})." >&2
                return "${exit_code}"
              fi
              delay=$((5 * attempt))
              if (( delay > 30 )); then
                delay=30
              fi
              echo "Build attempt ${attempt}/${BUILD_ATTEMPTS} failed (exit ${exit_code}); resuming the incremental build in ${delay}s." >&2
              sleep "${delay}"
              ((attempt += 1))
            done
          }
          build_with_retry 2>&1 | tee -a "${BUILD_LOG}"

      - name: Package public-signed APK
        shell: bash
        run: |
          set -euo pipefail
          built_apk="${CR_DIR}/out/thorium/apks/Thorium_Public.apk"
          test -f "${built_apk}"

          export JAVA_HOME="${CR_DIR}/third_party/jdk/current"
          test -x "${JAVA_HOME}/bin/java"
          export PATH="${JAVA_HOME}/bin:${PATH}"

          apksigner=$(find "${CR_DIR}/third_party/android_sdk" \
            -type f -name apksigner -perm -u+x -print | sort -V | tail -n 1)
          test -n "${apksigner}"

          mkdir -p dist
          public_apk="dist/Thorium-S26Plus-Oryon-arm64-public.apk"
          cp -f -- "${built_apk}" "${public_apk}"
          "${apksigner}" verify --verbose --print-certs "${public_apk}"
          sha256sum "${public_apk}" > "${public_apk}.sha256"

      - name: Upload public-signed APK (attempt 1)
        id: upload_public_apk_1
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorium-s26plus-oryon-arm64
          path: |
            dist/Thorium-S26Plus-Oryon-arm64-public.apk
            dist/Thorium-S26Plus-Oryon-arm64-public.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload public-signed APK (attempt 2)
        id: upload_public_apk_2
        if: steps.upload_public_apk_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorium-s26plus-oryon-arm64
          path: |
            dist/Thorium-S26Plus-Oryon-arm64-public.apk
            dist/Thorium-S26Plus-Oryon-arm64-public.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Upload public-signed APK (attempt 3)
        if: >-
          steps.upload_public_apk_1.outcome == 'failure' &&
          steps.upload_public_apk_2.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorium-s26plus-oryon-arm64
          path: |
            dist/Thorium-S26Plus-Oryon-arm64-public.apk
            dist/Thorium-S26Plus-Oryon-arm64-public.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorium-s26plus-build-log-${{ github.run_id }}
          path: build-android-s26.log
          if-no-files-found: warn
          retention-days: 7
